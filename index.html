.grid{position:absolute;inset:0;padding:1.4cqw 1.6cqw;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:1cqw 1.2cqw}
header{grid-column:1/-1;display:flex;align-items:center;gap:1.2cqw}
h1{margin:0;font-size:2.1cqw;font-weight:600;background:var(--card);padding:.5cqw 1.5cqw;border-radius:1.4cqw}
.sub{margin:0;font-size:1.25cqw;background:var(--card);padding:.5cqw 1.2cqw;border-radius:1.2cqw}
.chips{display:flex;gap:.6cqw;margin-left:auto;background:var(--card);padding:.4cqw .8cqw;border-radius:1.4cqw}
.chip{border:.15cqw solid var(--line);background:transparent;color:var(--ink);border-radius:9cqw;padding:.2cqw 1cqw;font:inherit;font-size:1.2cqw;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);backdrop-filter:blur(3px);box-shadow:0 .5cqw 1.5cqw rgba(40,80,140,.22);border:.2cqw solid var(--line);border-radius:1.8cqw;padding:1.1cqw 1.3cqw;display:flex;flex-direction:column;gap:.6cqw;min-height:0}
.q{font-family:'Patrick Hand',cursive;font-size:2cqw;text-align:center;margin:0}
svg{flex:1 1 0;min-height:0;width:100%;display:block}
.moving{transition:transform .7s cubic-bezier(.34,1.4,.5,1)}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.say{display:flex;gap:1cqw;align-items:center;background:var(--paper);border:.15cqw dashed var(--line);border-radius:1.4cqw;padding:.5cqw 1cqw;min-height:4.2cqw;font-family:'Patrick Hand',cursive;font-size:1.6cqw}
.say .av{font-size:2.3cqw}
.guess{display:flex;gap:.8cqw;align-items:center;justify-content:center;font-family:'Patrick Hand',cursive;font-size:1.6cqw}
.guess input{width:5cqw;font:inherit;text-align:center;border:.15cqw solid var(--line);border-radius:1cqw;padding:.2cqw;background:var(--paper);color:var(--ink)}
.row{display:flex;gap:.8cqw}
button.b{flex:1;border:0;border-radius:1.3cqw;padding:.8cqw;font:inherit;font-size:1.5cqw;font-weight:600;color:#1f3a63;cursor:pointer;box-shadow:0 .35cqw 0 rgba(0,0,0,.2);transition:transform .1s}
button.b:active{transform:translateY(.25cqw);box-shadow:0 .08cqw 0 rgba(0,0,0,.2)}
button.b:disabled{opacity:.4;cursor:not-allowed}
.l{background:var(--sky)}.r{background:var(--mint)}.go{background:var(--accent);color:#fff!important}.y{background:#cfe6ff}
.t{font-weight:600;margin:0;font-size:1.4cqw;color:var(--soft)}
.note{flex:1;min-height:0;overflow:hidden;background-color:var(--paper);border-radius:1.2cqw;padding:.5cqw 1.1cqw .5cqw 4cqw;font-family:'Patrick Hand',cursive;font-size:1.85cqw;background-image:linear-gradient(var(--line) .1cqw,transparent .1cqw);background-size:100% 2.4cqw;background-position:0 2.3cqw;position:relative;border:.15cqw solid var(--line)}
.note::before{content:"";position:absolute;left:3cqw;top:0;bottom:0;border-left:.18cqw solid #9cc4f0}
.ln{display:flex;justify-content:space-between;gap:1cqw;line-height:2.4cqw;animation:in .5s}
.ln.pre{color:var(--soft);font-size:1.6cqw}
.ln small{font-size:1.3cqw;color:var(--accent);text-align:right}
.ln.fin{color:#2f9e74;font-weight:700}
@keyframes in{from{opacity:0;transform:translateX(-8px)}}

.qr{display:flex;justify-content:space-between;align-items:center;gap:1cqw}
.q{text-align:left}
.dots{display:flex;gap:.5cqw}
.act{display:flex;flex-direction:column;gap:.6cqw;min-height:10cqw;justify-content:flex-end}
.act.big{flex:1;justify-content:center;gap:2cqw}
.opts{display:flex;gap:.8cqw}
.hint{font-family:'Patrick Hand',cursive;font-size:1.5cqw;color:var(--soft)}
.rule{background:var(--paper);border:.25cqw dashed var(--accent);border-radius:1.6cqw;padding:1.4cqw 2cqw;font-family:'Patrick Hand',cursive;font-size:2.4cqw;text-align:center;line-height:1.5}
.hide{display:none!important}
.act.big .opts .b{font-size:1.8cqw;padding:1.1cqw}
</style>
</head>

 for(const t of tk){
  if(t.t=='b')for(let i=0;i<t.n;i++){const w=t.d>1?34:bw,[px,rw]=pl(w),y=64-rw*rh-36,lab=S.open&&t.d==1&&t.n==1;
   h+=`<g class="bob"><rect x="${px-w/2}" y="${y}" width="${w}" height="36" rx="6" fill="var(--wood)" stroke="var(--wood2)" stroke-width="2.5"/><rect x="${px-4}" y="${y}" width="8" height="36" fill="var(--butter)" opacity=".8"/>${lab?`<text x="${px}" y="${y+27}" text-anchor="middle" font-size="22" font-weight="700" fill="#1f3a63">${S.x}</text>`:(w>30?face(px,y+19,w>40?1.1:.8):'')}${lab?'':`<text x="${px}" y="${y-3}" text-anchor="middle" font-size="11" fill="var(--soft)">${t.d>1?S.sym+'÷'+t.d:S.sym}</text>`}</g>`}
  else for(let i=0;i<Math.min(30,Math.round(t.n));i++){const [px,rw]=pl(t.t=='n'?23:bs),base=64-rw*rh;
   if(t.t=='o'){const y=base-r;h+=`<g class="bob" style="animation-delay:${(i%5)*.2}s"><circle cx="${px}" cy="${y}" r="${r}" fill="${COL[(i+c++)%5]}" stroke="rgba(0,0,0,.2)" stroke-width="1.5"/>${sm?'':face(px,y-1,.8)}</g>`}
   else h+=`<g class="bob"><path d="M${px} ${base}q-5-8 0-12" stroke="#c44" fill="none"/><ellipse cx="${px}" cy="${base-22}" rx="9" ry="11" fill="#ff8f9c" stroke="rgba(0,0,0,.2)"/>${face(px,base-22,.7)}</g>`}}
 return h+`<path d="M-80 66h160q-10 14-30 14h-100q-20 0-30-14z" fill="var(--wood2)"/>`}
function pan(id,inner,ex,ey){const g=$(id);g.style.transform=`translate(${ex}px,${ey}px)`;g.innerHTML=`<path d="M0 0L-60 66M0 0L60 66" stroke="var(--wood2)" stroke-width="2" fill="none"/>`+inner}
const wt=(tk,x)=>tk.reduce((s,t)=>s+(t.t=='b'?t.n*x/t.d:t.t=='o'?t.n:-t.n),0);
function draw(L,R,gx){const x=gx!=null?gx:S.x,diff=wt(L,x)-wt(R,x),ang=-Math.max(-13,Math.min(13,diff*3.5)),rad=ang*Math.PI/180;
 $('beam').style.transform=`rotate(${ang}deg)`;const ex=175*Math.cos(rad),ey=175*Math.sin(rad);pan('panL',items(L),-ex,-ey);pan('panR',items(R),ex,ey)}
const say=(a,t)=>{$('av').textContent=a;$('msg').textContent=t};
const act=h=>{$('act').innerHTML=h};
function addLn(t,n,c){const d=document.createElement('div');d.className='ln '+(c||'');d.innerHTML=`<span>${t}</span><small>${n||''}</small>`;$('note').appendChild(d)}
const CH=['1 Tebak','2 Misalkan','3 Persamaan','4 Selesaikan','5 Periksa','6 Kesimpulan'];
let ph=0;
const chips=()=>{$('chips').innerHTML=CH.map((n,i)=>`<span class="chip ${i==ph?'on':''}">${n}</span>`).join('')};
const btn=(h,t,c)=>`<div class="opts"><button class="b ${c||'go'}" data-h="${h}">${t}</button></div>`;
const show=on=>{$('sc').classList.toggle('hide',!on);$('act').classList.toggle('big',!on)};
const gUI=()=>`<div class="hint">Pikirkan dulu, lalu tulis tebakanmu.</div><div class="guess">1 kotak = <input id="ans" type="number" inputmode="numeric"> bola <button class="b go" data-h="guess" style="flex:none;padding:.6cqw 2cqw">Coba tebakan</button>${S.tries?'<button class="b y" data-h="toB" style="flex:none;padding:.6cqw 1.4cqw">Cari caranya bareng ➜</button>':''}</div>`;
function init(){S={sym:'?',x:2,Lt:[B(2,1),O(4)],Rt:[O(8)],open:false,tries:0,step:0};ph=0;chips();show(true);$('note').innerHTML='';$('soal').textContent='Timbangan ini seimbang!';draw(S.Lt,S.Rt);
 say('🐣','Kiri: 2 kotak + 4 bola. Kanan: 8 bola. Menurutmu, berat 1 kotak sama dengan berapa bola?');act(gUI())}
const STEPS=[
{L:[['Ambil 4 bola',1],['Tambah 4 bola',0],['Ambil 1 kotak',0]],R:[['Ambil 4 bola',1],['Tambah 4 bola',0],['Biarkan saja',2]],gl:()=>[B(2,1)],gr:()=>[O(4)],br:()=>[O(12)],pre:s=>`2${s} + 4 − 4 = 8 − 4`,note:'kedua ruas dikurangi 4',res:s=>`2${s} = 4`,q:'Supaya kotak tidak ditemani bola lagi, apa yang kamu lakukan di sisi kiri?',m1:'Bola di kiri sudah habis, tapi timbangan miring! Sisi kanan harus diapakan?',m2:'Seimbang lagi! Sekarang 2 kotak sama dengan 4 bola.'},
{L:[['Bagi dengan 2 (ambil 1 kotak)',1],['Kalikan dengan 2',0],['Ambil 2 bola',0]],R:[['Bagi dengan 2 (4 bola jadi 2 kelompok, ambil 1)',1],['Kalikan dengan 2',0],['Biarkan saja',2]],gl:()=>[B(1,1)],gr:()=>[O(2)],br:()=>[O(8)],pre:s=>`2${s} ÷ 2 = 4 ÷ 2`,note:'kedua ruas dibagi 2',res:s=>`${s} = 2`,q:'2 kotak sama dengan 4 bola. Untuk tahu berat 1 kotak, apa yang kamu lakukan di sisi kiri?',m1:'Tinggal satu kotak, tapi timbangan miring lagi! Sisi kanan harus diapakan?',m2:'Seimbang! 1 kotak sama dengan 2 bola.'}];
const optsH=(l,h)=>{l=l.slice();if(S.step%2)l.reverse();return `<div class="opts">${l.map(([t,v],i)=>`<button class="b ${['l','r','y'][i]}" data-h="${h}" data-v="${v}">${t}</button>`).join('')}</div>`};
function stepL(){const t=STEPS[S.step];say('🐣',t.q);act(optsH(t.L,'pL'))}
const kq=(txt,ws,h)=>`<div class="rule">${txt}</div><div class="opts">${ws.map(w=>`<button class="b l" data-h="${h}" data-v="${w}">${w}</button>`).join('')}</div>`;
const H={
init,
guess(){const v=parseFloat($('ans').value);if(isNaN(v))return say('🤔','Tulis dulu angka tebakanmu.');S.tries++;draw(S.Lt,S.Rt,v);
 const l=2*v+4;addLn(`1 kotak = ${v} → kiri ${l}, kanan 8`,l==8?'seimbang ✓':'miring ✗',l==8?'fin':'pre');
 if(l==8){say('🎉','Tebakanmu pas! Tapi kalau angkanya besar, menebak sulit. Yuk cari caranya supaya pasti.');act(btn('toB','Cari caranya ➜'))}
 else{say('🤔',`Kalau 1 kotak = ${v} bola, kiri jadi ${l} dan kanan 8. ${l>8?'Kiri kelebihan, coba angka lebih kecil.':'Kiri kurang, coba angka lebih besar.'}`);act(gUI());setTimeout(()=>{if(ph==0)draw(S.Lt,S.Rt)},2600)}},
toB(){ph=1;chips();say('✍️','Isi kotak belum kita ketahui, jadi kita beri nama pengganti supaya bisa ditulis. Pilih simbol untuk berat 1 kotak!');
 act(`<div class="opts">${['x','y','a','★'].map(s=>`<button class="b l" data-h="sym" data-v="${s}">${s}</button>`).join('')}</div>`)},
sym(v){S.sym=v;draw(S.Lt,S.Rt);say('✍️',`Mulai sekarang, berat 1 kotak kita tulis ${v}. Jadi 2 kotak = 2${v}.`);act(btn('toC','Tulis persamaannya ➜'))},
toC(){ph=2;chips();const s=S.sym;say('🐣','Tuliskan timbangan itu sebagai persamaan. Mana yang cocok dengan gambar?');
 act(`<div class="opts">${[[`${s} + 4 = 8`,0],[`2${s} + 4 = 8`,1],[`2 + ${s} + 4 = 8`,2]].map(([t,v],i)=>`<button class="b ${['l','r','y'][i]}" data-h="eq" data-v="${v}">${t}</button>`).join('')}</div>`)},
eq(v){const s=S.sym;if(v=='1'){addLn(`2${s} + 4 = 8`,'persamaan timbangan','fin');say('🎉','Betul! 2 kotak (2'+s+') ditambah 4 bola sama dengan 8 bola.');act(btn('toD','Selesaikan persamaannya ➜'))}
 else say('🤔',v=='0'?'Hitung lagi: ada berapa kotak di sisi kiri?':'Ada 2 kotak, bukan 2 bola. 2 kotak ditulis 2'+s+'.')},
toD(){ph=3;chips();S.step=0;stepL()},
pL(v){const t=STEPS[S.step];if(v=='1'){S.Lt=t.gl();draw(S.Lt,S.Rt);say('😮',t.m1);act(optsH(t.R,'pR'))}else say('🤔','Belum tepat. Kita ingin kotaknya tinggal sendiri, tapi timbangan harus tetap adil.')},
pR(v){const t=STEPS[S.step];if(v=='1'){S.Rt=t.gr();if(S.step==1)S.open=true;draw(S.Lt,S.Rt);addLn(t.pre(S.sym),t.note,'pre');addLn(t.res(S.sym),'','fin');say('🎉',t.m2);act(btn(S.step==0?'step2':'toE','Lanjut ➜'))}
 else if(v=='0'){draw(S.Lt,t.br());say('😵','Aduh, malah makin miring! Coba pilihan lain.');setTimeout(()=>{if(ph==3)draw(S.Lt,S.Rt)},2300)}
 else say('🙈','Kalau dibiarkan, timbangan tetap miring. Sisi kanan harus ikut diubah!')},
step2(){S.step=1;stepL()},
toE(){ph=4;chips();say('🔍','Saatnya memeriksa: kalau 1 kotak = 2 bola, apakah timbangan awal tetap seimbang?');act(btn('chk','Ganti tiap kotak dengan 2 bola'))},
chk(){S.open=false;S.Lt=[O(8)];S.Rt=[O(8)];draw(S.Lt,S.Rt);addLn(`2 × 2 + 4 = 8`,'cocok ✓','fin');say('✅','Seimbang! 2×2 + 4 = 8. Jadi isi satu kotak = 2 bola.');act(btn('toF','Tarik kesimpulan ➜'))},
toF(){ph=5;chips();show(false);$('soal').textContent='Kesimpulan';say('🐣','Dari langkah-langkahmu tadi, lengkapi kalimat ini!');
 act(kq(`Pada <b>2${S.sym} + 4 = 8</b>, langkah pertama: kedua ruas harus <b>…………</b> 4.`,['dikurangi','ditambah'],'k1'))},
k1(v){if(v=='dikurangi'){say('👍','Benar! Lawan dari + adalah −. Sekarang langkah kedua.');act(kq(`Langkah kedua pada <b>2${S.sym} = 4</b>: kedua ruas harus <b>…………</b> 2.`,['dibagi','dikali'],'k2'))}else say('🤔','Bola yang menemani kotak ingin kita hilangkan. Apa lawan dari menambah?')},
k2(v){if(v=='dibagi'){addLn('lawan operasi, kedua ruas','kesimpulan','fin');say('🏆','Hebat! Kamu menemukan caranya sendiri.');act(`<div class="rule">Apa pun yang dilakukan pada ruas kiri, <b>harus dilakukan juga pada ruas kanan</b>. Pakai <b>lawan operasinya</b> (+ lawan −, × lawan ÷) agar ${S.sym} sendirian.</div>`+btn('init','Ulangi dari awal ↺','y'))}else say('🤔','2x artinya 2 kali x. Apa lawan dari mengalikan?')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(b&&H[b.dataset.h])H[b.dataset.h](b.dataset.v)});
init();
</script>
</body>
</html>
